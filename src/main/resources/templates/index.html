<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main_layout}">
    <body>
        <div layout:fragment="content">


            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="https://kahoot.com/files/2019/02/Kahoot-at-school-14-scaled.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="https://kahoot.com/files/2019/02/GuidesTuts-GettingStarted-CoverImage-725x408.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="https://kahoot.com/files/2019/02/GuidesTuts-GettingStarted-CoverImage-725x408.png" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>



            <div class="jumbotron bg-light mt-4">
                <h1 class="display-4">Welcome to Quizzy!</h1>
                <p class="lead">Create quizzes, share them and play with your friends.</p>
                <hr class="my-4">
                <p>Quizzy helps you build and take interactive quizzes in a few clicks.</p>
                <a class="btn btn-primary btn-lg" href="#" role="button">Learn more</a>
            </div>

        </div>
    </body>
</html>
