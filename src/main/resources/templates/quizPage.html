
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: #16a36a;
            font-size: 36px;
        }

        .question-card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .question-number {
            color: #16a36a;
            font-weight: bold;
        }

        .answer {
            background: #f4f7f5;
            padding: 15px;
            margin-top: 12px;
            border-radius: 10px;
        }
        .answer button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #f4f7f5;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
        }

        .answer button:not(:disabled):hover {
            background: #d9f5e7;
        }

        .answer button {
            width: 100%;
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: #f4f7f5;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .answer button.correct {
            background: #d1fae5;
            border-color: #16a36a;
        }

        .answer button.incorrect {
            background: #fee2e2;
            border-color: #dc2626;
        }

        .answer button:disabled {
            cursor: not-allowed;
        }
    </style>
</head>

    <body>

        <div class="container">
            <div class="header">
                <h1>QUIZZY</h1>
                <h2 th:text="${quiz.title}">Quiz title</h2>
                <p th:text="${quiz.description}">Description</p>
            </div>

            <div th:each="question, status : ${questions}"
                 class="question-card">

                <p class="question-number"
                   th:text="'QUESTION ' + ${status.count}">
                    QUESTION 1
                </p>

                <h2 th:text="${question.text}">
                    Question text
                </h2>

                <div th:each="answer : ${answersByQuestionId[question.id]}"
                     class="answer">

                    <button type="button"
                            th:text="${answer.text}"
                            th:attr="data-answer-id=${answer.id}"
                            onclick="checkAnswer(this)">
                    </button>

                </div>

            </div>

        </div>

        <script>

            async function checkAnswer(button) {

                const answerId = button.dataset.answerId;

                try {
                    const response = await fetch(`/api/answers/${answerId}/check`);

                    const result = await response.json();

                    console.log("Answer ID:", answerId);
                    console.log("Backend result:", result.correct);

                    const buttons = button.closest(".question-card")
                        .querySelectorAll(".answer button");

                    buttons.forEach(btn => {
                        btn.disabled = true;
                    });

                    if (result.correct === true) {
                        button.classList.add("correct");
                    } else {
                        button.classList.add("incorrect");
                    }

                } catch (error) {
                    console.error("Error:", error);
                }
            }


        </script>
    </body>
</html>
