<!DOCTYPE html>
<html lang="en"  xmlns:th=" http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="main_layout.html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzy</title>
    <link rel="icon" type="image/png"
          th:href="@{/quizzy-favicon.png}">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #16a36a;
            font-size: 36px;
        }

        .question-card, .result-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
        }

        .question-number {
            color: #16a36a;
            font-weight: bold;
        }

        .answer {
            margin-top: 12px;
        }

        .answer button {
            width: 100%;
            padding: 17px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: #f4f7f5;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer button:not(:disabled):hover {
            background: #d9f5e7;
        }

        .answer button.correct {
            background: #d1fae5;
            border-color: #16a36a;
        }

        .answer button.incorrect {
            background: #fee2e2;
            border-color: #dc2626;
        }

        .answer button:disabled {
            cursor: not-allowed;
        }

        .progress-container {
            background: #e0e7e3;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: #16a36a;
            transition: width 0.3s;
        }

        .result-card {
            display: none;
            text-align: center;
        }

        .result-card h2 {
            color: #16a36a;
        }

        .result-score {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }

        .result-card button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            background: #16a36a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

    <body>

    <div class="container mt-5">
        <div class="row">

        </div>
    </div>



    </body>
</html>
