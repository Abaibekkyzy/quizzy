<!DOCTYPE html>
<html lang="en"  xmlns:th=" http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="main_layout.html">

    <div layout:fragment="content">

        <div class="header">
            <h1>QUIZZY</h1>
            <h2 th:text="${quiz.title}">Quiz title</h2>
            <p th:text="${quiz.description}">Description</p>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div th:each="question, status : ${questions}"
             class="question-card"
             th:attr="data-question-index=${status.index}">

             <p class="question-number"
                th:text="${status.index + 1}"></p>
    </div>
</html>
